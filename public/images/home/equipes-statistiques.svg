<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Exemple de carte de statistiques individuelles d'un joueur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#0b0e14"/>
  <rect x="40" y="40" width="720" height="420" rx="24" fill="#131824" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  <circle cx="110" cy="115" r="38" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="3"/>
  <circle cx="110" cy="105" r="13" fill="#22c55e"/>
  <path d="M84 142c4-18 14-26 26-26s22 8 26 26" fill="#22c55e"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="172" y="108" font-size="26" font-weight="700" fill="#ffffff">Profil du joueur</text>
    <text x="172" y="138" font-size="16" fill="#a1a1aa">Attaquant · exemple de statistiques</text>
    <g font-size="16" fill="#d4d4d8">
      <text x="80" y="220">Buts</text>
      <text x="80" y="275">Passes décisives</text>
      <text x="80" y="330">Tirs cadrés</text>
