    </g>
    <g fill="#ffffff" fill-opacity=".08">
      <rect x="260" y="205" width="420" height="14" rx="7"/>
      <rect x="260" y="260" width="420" height="14" rx="7"/>
      <rect x="260" y="315" width="420" height="14" rx="7"/>
      <rect x="260" y="370" width="420" height="14" rx="7"/>
    </g>
    <g fill="#22c55e">
      <rect x="260" y="205" width="290" height="14" rx="7"/>
      <rect x="260" y="260" width="190" height="14" rx="7"/>
      <rect x="260" y="315" width="340" height="14" rx="7"/>
      <rect x="260" y="370" width="380" height="14" rx="7"/>
    </g>
    <text x="722" y="400" font-size="12" fill="#71717a" text-anchor="end">Illustration : valeurs fictives</text>
    <text x="80" y="432" font-size="13" fill="#a1a1aa">À lire selon la compétition, la période et le temps de jeu.</text>
  </g>
