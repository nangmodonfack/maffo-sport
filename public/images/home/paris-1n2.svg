<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Les trois issues d'un match : 1 victoire à domicile, N match nul, 2 victoire à l'extérieur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#0b0e14"/>
  <rect x="30" y="30" width="740" height="440" rx="24" fill="#131824" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="95" font-size="24" font-weight="700" fill="#ffffff">Les trois issues d’un match</text>
    <g>
      <rect x="70" y="140" width="190" height="210" rx="18" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-width="3"/>
      <rect x="305" y="140" width="190" height="210" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
      <rect x="540" y="140" width="190" height="210" rx="18" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-width="3"/>
    </g>
    <g font-size="84" font-weight="700">
      <text x="165" y="265" fill="#22c55e">1</text>
      <text x="400" y="265" fill="#ffffff">N</text>
      <text x="635" y="265" fill="#22c55e">2</text>
    </g>
    <g font-size="16" fill="#d4d4d8">
      <text x="165" y="310">Victoire à domicile</text>
      <text x="400" y="310">Match nul</text>
      <text x="635" y="310">Victoire à l’extérieur</text>
    </g>
    <text x="400" y="420" font-size="15" fill="#a1a1aa">Double chance : 1X, X2 ou 12 couvrent deux de ces trois issues</text>
  </g>
</svg>
