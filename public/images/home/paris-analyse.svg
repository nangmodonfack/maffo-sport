<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Méthode d'analyse en étapes : collecter, comparer, décider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#0b0e14"/>
  <rect x="30" y="30" width="740" height="440" rx="24" fill="#131824" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="400" y="95" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Une analyse en étapes</text>
    <g stroke="#22c55e" stroke-width="3" fill="#22c55e" fill-opacity=".12">
      <rect x="90" y="140" width="620" height="60" rx="14"/>
      <rect x="90" y="220" width="620" height="60" rx="14"/>
      <rect x="90" y="300" width="620" height="60" rx="14"/>
      <rect x="90" y="380" width="620" height="60" rx="14"/>
    </g>
    <g fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M118 170l10 10 18-22"/><path d="M118 250l10 10 18-22"/><path d="M118 330l10 10 18-22"/>
      <rect x="118" y="398" width="28" height="28" rx="6" stroke-opacity=".6"/>
    </g>
    <g font-size="19" fill="#e4e4e7">
      <text x="170" y="177">1. Collecter les faits : forme, absences, calendrier</text>
      <text x="170" y="257">2. Comparer avec le marché et la cote proposée</text>
      <text x="170" y="337">3. Identifier ce que l’on ne sait pas</text>
      <text x="170" y="417">4. Décider… ou renoncer</text>
    </g>
  </g>
</svg>
