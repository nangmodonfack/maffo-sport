<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Exemple de lecture d'une cote : cote 2,00, probabilité implicite 50 %" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#0b0e14"/>
  <rect x="30" y="30" width="740" height="440" rx="24" fill="#131824" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="95" font-size="24" font-weight="700" fill="#ffffff">Lire une cote : un exemple</text>
    <rect x="90" y="150" width="190" height="150" rx="18" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-width="3"/>
    <text x="185" y="225" font-size="56" font-weight="700" fill="#22c55e">2,00</text>
    <text x="185" y="270" font-size="15" fill="#d4d4d8">cote décimale</text>
    <text x="330" y="235" font-size="44" font-weight="700" fill="#a1a1aa">→</text>
    <rect x="380" y="150" width="150" height="150" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    <text x="455" y="225" font-size="50" font-weight="700" fill="#ffffff">50 %</text>
    <text x="455" y="270" font-size="15" fill="#d4d4d8">probabilité implicite</text>
    <text x="580" y="235" font-size="44" font-weight="700" fill="#a1a1aa">→</text>
    <rect x="630" y="150" width="110" height="150" rx="18" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-width="3"/>
    <text x="685" y="215" font-size="28" font-weight="700" fill="#22c55e">×2</text>
    <text x="685" y="250" font-size="14" fill="#d4d4d8">retour</text>
    <text x="685" y="270" font-size="14" fill="#d4d4d8">potentiel</text>
    <text x="400" y="370" font-size="18" fill="#d4d4d8">Formule : 1 ÷ cote × 100</text>
    <text x="400" y="410" font-size="14" fill="#a1a1aa">La marge de l’opérateur n’est pas incluse dans ce calcul.</text>
  </g>
</svg>
