<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Frise chronologique : 1863 Football Association, 1904 FIFA, 1930 première Coupe du monde, 1957 CAF et première CAN" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#0b0e14"/>
  <rect x="30" y="30" width="740" height="440" rx="24" fill="#131824" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Les grandes dates du football</text>
  <line x1="400" y1="130" x2="400" y2="430" stroke="#22c55e" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
  <g fill="#22c55e" stroke="#0b0e14" stroke-width="4">
    <circle cx="400" cy="150" r="11"/><circle cx="400" cy="235" r="11"/>
    <circle cx="400" cy="320" r="11"/><circle cx="400" cy="405" r="11"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="26" font-weight="700" fill="#22c55e" text-anchor="end">
      <text x="372" y="159">1863</text><text x="372" y="329">1930</text>
    </g>
    <g font-size="26" font-weight="700" fill="#22c55e" text-anchor="start">
      <text x="428" y="244">1904</text><text x="428" y="414">1957</text>
    </g>
    <g font-size="15" fill="#d4d4d8" text-anchor="start">
      <text x="428" y="156">Création de la</text><text x="428" y="176">Football Association</text>
      <text x="428" y="326">Première Coupe du monde</text><text x="428" y="346">en Uruguay</text>
    </g>
    <g font-size="15" fill="#d4d4d8" text-anchor="end">
      <text x="372" y="241">Fondation de la FIFA</text><text x="372" y="261">à Paris</text>
      <text x="372" y="411">Naissance de la CAF</text><text x="372" y="431">et première CAN</text>
    </g>
  </g>
